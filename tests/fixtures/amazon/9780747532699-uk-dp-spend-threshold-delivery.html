<!--
  Synthetic Amazon UK dp-page fixture for ISBN 9780747532699 with a
  populated delivery block whose "FREE delivery" promise is CONDITIONAL on
  a spend threshold (D33) rather than genuine. Wording verified against a
  real live capture, tests/fixtures/amazon/products/B0CYT8WL1G-uk-dp-
  2026-09-04.html, reading verbatim:

    FREE delivery Tuesday, 8 September on orders dispatched by Amazon over £35

  D33 is the books-side sibling of that finding — a single sub-threshold
  book does not qualify for this promo either, so the buy-box is exposed
  to the same defect on this side of the source too. Sibling of
  9780747532699-uk-dp-free-delivery.html (genuinely-free),
  -paid-delivery.html (paid), and -conditional-delivery.html (the other
  evidenced marker, "on your first order"); this one must also parse to
  shipping_minor=None, not 0.
-->
<!DOCTYPE html>
<html lang="en-gb">
<head>
  <meta charset="utf-8">
  <title>Harry Potter and the Philosopher's Stone: Amazon.co.uk: Books</title>
</head>
<body>
  <div id="dp-container">
    <div id="corePriceDisplay_desktop_feature_div">
      <span class="a-price">
        <span class="a-offscreen">&pound;7.99</span>
      </span>
    </div>

    <div id="mir-layout-DELIVERY_BLOCK">
      <div id="mir-layout-DELIVERY_BLOCK-slot-PRIMARY_DELIVERY_MESSAGE_LARGE">
        <span>
          <span class="a-text-bold">FREE delivery</span>
          <span class="a-text-bold">Tuesday, 8 September</span>
          on orders dispatched by Amazon over £35
          <a href="/gp/help/customer/display.html/?nodeId=492868">Details</a>
        </span>
      </div>
    </div>

    <div id="merchant-info">
      <span>Sold and dispatched by <a href="/sp?seller=A3P5ROKL5A1OLE">Amazon</a></span>
    </div>
  </div>
</body>
</html>
