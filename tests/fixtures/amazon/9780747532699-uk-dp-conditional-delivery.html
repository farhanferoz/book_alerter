<!--
  Synthetic Amazon UK dp-page fixture for ISBN 9780747532699 with a
  populated delivery block whose "FREE delivery" promise is CONDITIONAL
  (T2.5) rather than genuine. Wording verified against a real live capture
  (tests/fixtures/amazon/products/B0F3NVWM37-uk-aod-2026-09-04.html, 8 of
  10 offer-listing rows) and an earlier live capture of a different ASIN,
  both reading verbatim:

    FREE delivery <dates> on your first order to UK or Ireland.

  This is the dp-page equivalent of that same promo — Amazon shows a
  cookieless visitor a first-order-only delivery price on the buy-box too,
  not just on offer-listing rows. Sibling of
  9780747532699-uk-dp-free-delivery.html (genuinely-free) and
  -paid-delivery.html (paid); this one must parse to shipping_minor=None,
  not 0.
-->
<!DOCTYPE html>
<html lang="en-gb">
<head>
  <meta charset="utf-8">
  <title>Harry Potter and the Philosopher's Stone: Amazon.co.uk: Books</title>
</head>
<body>
  <div id="dp-container">
    <div id="corePriceDisplay_desktop_feature_div">
      <span class="a-price">
        <span class="a-offscreen">&pound;7.99</span>
      </span>
    </div>

    <div id="mir-layout-DELIVERY_BLOCK">
      <div id="mir-layout-DELIVERY_BLOCK-slot-PRIMARY_DELIVERY_MESSAGE_LARGE">
        <span>
          <span class="a-text-bold">FREE delivery</span>
          <span class="a-text-bold">Monday, 18 May</span>
          on your first order to UK or Ireland.
          <a href="/gp/help/customer/display.html/?nodeId=492868">Details</a>
        </span>
      </div>
      <div id="mir-layout-DELIVERY_BLOCK-slot-SECONDARY_DELIVERY_MESSAGE_LARGE">
        <span>Or fastest delivery <span class="a-text-bold">Tomorrow, 16 May</span>.</span>
      </div>
    </div>

    <div id="merchant-info">
      <span>Sold and dispatched by <a href="/sp?seller=A3P5ROKL5A1OLE">Amazon</a></span>
    </div>
  </div>
</body>
</html>
