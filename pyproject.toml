[project]
name = "book-alerter"
version = "0.0.1"
description = "Self-hosted book price comparison and alerting"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.28",
    "selectolax>=0.3.27",
    "isbnlib>=3.10",
    "apscheduler>=3.11",
    "watchfiles>=0.24",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "playwright>=1.59.0",
    "pillow>=11.0",
    "pytesseract>=0.3.13",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "vcrpy>=6.0",
    "freezegun>=1.5",
    "hypothesis>=6.122",
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_alerter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# E2E Docker-smoke tests boot a real container and are slow + require
# docker; default runs skip them. Opt in with `pytest -m e2e tests/e2e/`.
markers = [
    "e2e: end-to-end docker container tests (slow, requires docker)",
]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# RUF001-003 flag intentional typography in prose: en-dashes for time/value
# ranges (`22:00–08:00`), `×` for multiplication ("3 × hourly"), `∨` for
# logical-or in math comments (`s ≤ cur ∨ cur < e`), and the NO-BREAK SPACE
# in Amazon's "Sold by:" strip-set. Rewriting these to ASCII degrades the
# docs without catching real bugs.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Alembic-autogenerated index definitions exceed 100 chars by design;
# wrapping them diverges from what `alembic revision --autogenerate`
# emits and makes diffs against future schema changes harder.
"src/book_alerter/db/migrations/versions/*.py" = ["E501"]
# SQLAlchemy field declarations and raw-SQL view definitions occasionally
# breach 100 chars; the natural form is clearer than a wrapped one.
"src/book_alerter/db/models.py" = ["E501"]
"src/book_alerter/db/views.py" = ["E501"]
# Test setup uses the compact `session.add(x); session.commit(); session.refresh(x)`
# idiom consistently — splitting each call into three lines obscures fixture intent.
"tests/**/*.py" = ["E702"]

[tool.ty.environment]
python-version = "3.12"
