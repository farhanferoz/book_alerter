[project]
name = "book-alerter"
version = "0.0.1"
description = "Self-hosted book price comparison and alerting"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.28",
    "selectolax>=0.3.27",
    "isbnlib>=3.10",
    "apscheduler>=3.11",
    "watchfiles>=0.24",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "vcrpy>=6.0",
    "freezegun>=1.5",
    "hypothesis>=6.122",
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_alerter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ty.environment]
python-version = "3.13"
